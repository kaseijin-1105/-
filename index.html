<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>超常現象研究所</title>

<style>

*{
    box-sizing:border-box;
}

body{
    background:black;
    text-align:center;
    color:white;
    font-family:Meiryo,sans-serif;
    margin:0;
    padding:20px 16px;
}

img{
    display:block;
    width:100%;
    max-width:600px;
    height:auto;
    margin:clamp(16px,6vh,40px) auto 24px;
}

input{
    display:block;
    padding:12px;
    width:100%;
    max-width:360px;
    min-height:48px;
    margin:0 auto 12px;
    font-size:16px;
}

button{
    padding:12px 20px;
    min-height:48px;
    font-size:16px;
    cursor:pointer;
}

#error{
    color:red;
    margin-top:10px;
}

</style>

</head>

<body>

<img src="logo.png" alt="研究所ロゴ">

<h2>職員認証</h2>

<input
type="password"
id="password"
placeholder="パスワードを入力">

<button onclick="checkPassword()">
認証
</button>

<p id="error"></p>

<audio id="startSound">
    <source src="start.mp3" type="audio/mpeg">
</audio>

<script>

function checkPassword(){

    const password =
        document.getElementById("password").value;

    if(password === "4401"){

        localStorage.setItem(
            "authenticated",
            "true"
        );

        localStorage.setItem(
            "currentQuestion",
            "0"
        );

        localStorage.setItem(
            "unlockedQuestion",
            "0"
        );

        const sound =
            document.getElementById("startSound");

        sound.play().catch(()=>{});

        setTimeout(function(){

            location.href = "start.html";

        },500);

    }
    else{

        document.getElementById("error").textContent =
            "パスワードが違います";

    }
}

document.getElementById("password")
.addEventListener("keypress",function(event){

    if(event.key === "Enter"){

        checkPassword();

    }

});

</script>

</body>
</html>
