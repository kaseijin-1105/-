<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>問題</title>

<style>

*{
    box-sizing:border-box;
}

body{
    background:#111;
    color:white;
    text-align:center;
    font-family:Meiryo,sans-serif;
    margin:0;
}

.container{
    width:100%;
    max-width:760px;
    margin:auto;
    padding:clamp(20px,5vw,36px) 16px;
}

.question{
    white-space:pre-line;
    font-size:clamp(20px,5vw,24px);
    margin:clamp(20px,6vw,36px) 0;
    overflow-wrap:anywhere;
}

input{
    padding:10px;
    width:100%;
    max-width:360px;
    min-height:48px;
    font-size:16px;
}

button{
    padding:10px 20px;
    margin:5px;
    min-height:48px;
    font-size:16px;
}

.correct{
    color:#00ff88;
    font-size:clamp(20px,5vw,24px);
}

.wrong{
    color:red;
    font-size:clamp(20px,5vw,24px);
}

</style>
</head>

<body>

<audio id="startSound">
    <source src="start.mp3" type="audio/mpeg">
</audio>

<div class="container">

<h1 id="title"></h1>

<div class="question" id="question"></div>

<input
type="text"
id="answer"
placeholder="解答">

<br><br>

<button onclick="judgeAnswer()">
判定
</button>

<div id="result"></div>

<br>

<button id="prevBtn" onclick="prevQuestion()">
前の問題
</button>

<button id="nextBtn" onclick="nextQuestion()">
次の問題
</button>

</div>

<script>

<script>

const questions = [

{
title:"第１問",
question:"➀➁➂➃",
answer:"GAME"
},

{
title:"第２問",
question:"事件の真相はいつも裏にある",
answer:"ゆうき"
},

{
title:"第３問",
question:"漢字で解答してください",
answer:"象"
},

{
title:"第４問",
question:"口を揃えて解答してください",
answer:"4000"
},

{
title:"第５問",
question:"探してください",
answer:"4000"
}

];

// 認証チェック
if(localStorage.getItem("authenticated") !== "true"){

    location.href = "index.html";

}

// 現在の問題
let currentQuestion =
Number(localStorage.getItem("currentQuestion") || 0);

// 解放済み問題
let unlockedQuestion =
Number(localStorage.getItem("unlockedQuestion") || 0);


function displayQuestion(){

document.title =
questions[currentQuestion].title;

document.getElementById("title").textContent =
questions[currentQuestion].title;

document.getElementById("question").textContent =
questions[currentQuestion].question;

document.getElementById("answer").value = "";

document.getElementById("result").innerHTML = "";

// 前へボタン

document.getElementById("prevBtn").style.display =
currentQuestion === 0
? "none"
: "inline-block";

// 次へボタン

document.getElementById("nextBtn").style.display =
currentQuestion < unlockedQuestion
? "inline-block"
: "none";

localStorage.setItem(
"currentQuestion",
currentQuestion
);

}


function judgeAnswer(){

const userAnswer =
document.getElementById("answer")
.value
.trim();

const correctAnswer =
questions[currentQuestion]
.answer;

const result =
document.getElementById("result");

if(
userAnswer.toUpperCase()
===
correctAnswer.toUpperCase()
){

result.className="correct";

result.innerHTML="✅ 正解";

// 解放処理

if(currentQuestion === unlockedQuestion
&& currentQuestion < questions.length - 1){

unlockedQuestion++;

localStorage.setItem(
"unlockedQuestion",
unlockedQuestion
);

document.getElementById("nextBtn")
.style.display =
"inline-block";

}

// 最終問題

if(
currentQuestion
===
questions.length - 1
){

result.innerHTML =
`
✅ 正解
<br><br>
以上で問題は終了です。
<br>
お疲れ様でした。
`;

if(navigator.vibrate){

navigator.vibrate(
[300,100,300,100,300]
);

}

}

}else{

result.className="wrong";

result.innerHTML="❌ 不正解";

}

}


function nextQuestion(){

if(
currentQuestion + 1
>
unlockedQuestion
){

alert(
"先に現在の問題を解いてください"
);

return;

}

if(
currentQuestion
<
questions.length - 1
){

currentQuestion++;

displayQuestion();

}

}


function prevQuestion(){

if(currentQuestion > 0){

currentQuestion--;

displayQuestion();

}

}


window.onload = function(){

displayQuestion();

};

</script>

</script>

</body>
</html>
