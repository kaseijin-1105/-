<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>問題</title>

<style>

*{
    box-sizing:border-box;
}

body{
    background:#111;
    color:white;
    text-align:center;
    font-family:Meiryo,sans-serif;
    margin:0;
}

.container{
    width:100%;
    max-width:760px;
    margin:auto;
    padding:20px;
}

.question{
    white-space:pre-line;
    font-size:24px;
    margin:30px 0;
}

input{
    padding:10px;
    width:100%;
    max-width:400px;
    font-size:18px;
}

button{
    padding:10px 20px;
    margin:5px;
    font-size:18px;
}

.correct{
    color:#00ff88;
    font-size:24px;
    margin-top:20px;
}

.wrong{
    color:red;
    font-size:24px;
    margin-top:20px;
}

</style>

</head>

<body>

<div class="container">

<h1 id="title"></h1>

<div class="question" id="question"></div>

<input
type="text"
id="answer"
placeholder="解答">

<br><br>

<button onclick="judgeAnswer()">
判定
</button>

<div id="result"></div>

<br>

<button id="prevBtn" onclick="prevQuestion()">
前の問題
</button>

<button id="nextBtn" onclick="nextQuestion()">
次の問題
</button>

</div>

<script>

// 認証確認
if(localStorage.getItem("authenticated") !== "true"){
    location.href = "index.html";
}


// 問題データ
const questions = [

{
title:"第１問",
question:"➀➁➂➃",
answer:"GAME"
},

{
title:"第２問",
question:"事件の真相はいつも裏にある",
answer:"ゆうき"
},

{
title:"第３問",
question:"漢字で解答してください",
answer:"象"
},

{
title:"第４問",
question:"口を揃えて解答してください",
answer:"4000"
},

{
title:"第５問",
question:"探してください",
answer:"4000"
}

];


// 現在位置
let currentQuestion =
Number(localStorage.getItem("currentQuestion") || 0);

// 解放済み問題
let unlockedQuestion =
Number(localStorage.getItem("unlockedQuestion") || 0);


// 表示更新
function displayQuestion(){

document.getElementById("title").textContent =
questions[currentQuestion].title;

document.getElementById("question").textContent =
questions[currentQuestion].question;

document.getElementById("answer").value = "";

document.getElementById("result").innerHTML = "";

document.getElementById("prevBtn").style.display =
currentQuestion === 0
? "none"
: "inline-block";

// 第1～3問は常に次へ表示
if(currentQuestion <= 2){

    document.getElementById("nextBtn")
    .style.display = "inline-block";

}

// 第4問以降は解放済みのみ
else{

    if(
        currentQuestion === 3 &&
        unlockedQuestion === 4
    ){

        document.getElementById("nextBtn")
        .style.display = "inline-block";

    }
    else{

        document.getElementById("nextBtn")
        .style.display =
        currentQuestion < unlockedQuestion
        ? "inline-block"
        : "none";

    }

}
localStorage.setItem(
"currentQuestion",
currentQuestion
);

}


// 判定
function judgeAnswer(){

const userAnswer =
document.getElementById("answer")
.value
.trim();

const correctAnswer =
questions[currentQuestion]
.answer;

const result =
document.getElementById("result");


if(
userAnswer.toUpperCase()
===
correctAnswer.toUpperCase()
){

    // 第4問だけ正解表示しない
    if(currentQuestion === 3){

        result.innerHTML = "";

    }
    else{

        result.className = "correct";
        result.innerHTML = "✅ 正解";

    }

// 第4問正解時のみ第5問を解放
if(currentQuestion === 3){

    alert("第5問を解放します");

    unlockedQuestion = 4;

    localStorage.setItem(
        "unlockedQuestion",
        unlockedQuestion
    );

    document.getElementById("nextBtn")
    .style.display =
    "inline-block";

}
    // 最終問題
    if(
    currentQuestion === questions.length - 1
    ){

        result.innerHTML =
        "✅ 正解<br><br>以上で問題は終了です。<br>お疲れ様でした。";

        if(navigator.vibrate){

            navigator.vibrate(
            [300,100,300,100,300]
            );

        }

    }

}
else{

result.className = "wrong";
result.innerHTML = "❌ 不正解";

}

}


// 次へ
function nextQuestion(){

// 第1～3問は自由移動
if(currentQuestion <= 2){

    if(currentQuestion < questions.length - 1){

        currentQuestion++;

        displayQuestion();

    }

    return;

}

// 第4問以降
if(
currentQuestion + 1
>
unlockedQuestion
){

alert(
"先にこの問題を正解してください"
);

return;

}

if(
currentQuestion
<
questions.length - 1
){

currentQuestion++;

displayQuestion();

}

}


// 前へ
function prevQuestion(){

if(currentQuestion > 0){

currentQuestion--;
displayQuestion();

}

}


// Enterキー対応
document.addEventListener("DOMContentLoaded",function(){

displayQuestion();

document.getElementById("answer")
.addEventListener("keypress",function(e){

if(e.key === "Enter"){

judgeAnswer();

    }
    

});

});

</script>

</body>
</html>
