<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>{{ question.title }}</title>

<style>
*{
    box-sizing:border-box;
}

body{
    background:#111;
    color:white;
    text-align:center;
    font-family:Meiryo;
    margin:0;
}

.container{
    width:100%;
    max-width:760px;
    margin:auto;
    padding:clamp(20px, 5vw, 36px) 16px;
}

.question{
    white-space:pre-line;
    font-size:clamp(20px, 5vw, 24px);
    margin:clamp(20px, 6vw, 36px) 0;
    overflow-wrap:anywhere;
}

input{
    padding:10px;
    width:100%;
    max-width:360px;
    min-height:48px;
    font-size:16px;
}

button{
    padding:10px 20px;
    margin:5px;
    min-height:48px;
    font-size:16px;
    max-width:100%;
}

.correct{
    color:#00ff88;
    font-size:clamp(20px, 5vw, 24px);
    overflow-wrap:anywhere;
}

</style>
</head>

<body>
<audio id="startSound" autoplay>
    <source src="{{ url_for('static', filename='start.mp3') }}">
</audio>
<div class="container">

<h1>{{ question.title }}</h1>

<div class="question">
{{ question.question }}
</div>

<form method="post">

<input
type="text"
name="answer"
placeholder="解答">

<br><br>

<button type="submit">
判定
</button>

</form>

<div class="correct">
{{ result }}
</div>

{% if completed %}
<div class="correct">
以上で問題は終了です．お疲れ様でした．
</div>
{% endif %}

<br>

{% if qid > 0 %}
<a href="{{ url_for('question', qid=qid-1) }}">
<button>前の問題に戻る</button>
</a>
{% endif %}

{% if qid < total-1 %}
{% if can_go_next %}
<a href="{{ url_for('question', qid=qid+1) }}">
<button>次の問題へ</button>
</a>
{% endif %}
{% endif %}

</div>

{% if vibrate %}
<script>
if ("vibrate" in navigator) {
    navigator.vibrate(2000);
}
</script>
{% endif %}

</body>
</html>
