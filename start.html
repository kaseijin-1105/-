<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>認証成功</title>

<style>

*{
    box-sizing:border-box;
}

body{
    background:black;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    font-family:Meiryo,sans-serif;
    text-align:center;
    margin:0;
}

#message{
    font-size:clamp(32px,10vw,50px);
}

</style>

</head>

<body>

<div id="message">
認証成功
</div>

<audio id="authSound">
    <source src="start.mp3" type="audio/mpeg">
</audio>

<audio id="aiVoice">
    <source src="ai_start.mp3" type="audio/mpeg">
</audio>

<script>

if(localStorage.getItem("authenticated") !== "true"){
    location.href = "index.html";
}

window.onload = function(){

    if(navigator.vibrate){
        navigator.vibrate([200,100,200]);
    }

    const authSound =
        document.getElementById("authSound");

    authSound.play().catch(()=>{});

    setTimeout(function(){

        document
        .getElementById("aiVoice")
        .play()
        .catch(()=>{});

    },1000);

    setTimeout(function(){

        location.href =
        "question.html";

    },9000);

};

</script>

</body>
</html>

</script>

</body>
</html>
